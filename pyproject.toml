[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "steamdeck-client"
version = "0.1.0"
description = "Wake-on-LAN and Steam Remote Play launcher for Steam Deck"
requires-python = ">=3.11"
dependencies = [
    "pygame-ce>=2.4",
    "wakeonlan>=3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
